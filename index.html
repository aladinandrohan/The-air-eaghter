<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Studios Airfighter</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        #ui-layer { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 10; }
        .glass-panel { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); padding: 30px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
        canvas { display: block; }
        button { padding: 10px 20px; border-radius: 10px; border: none; background: #6a11cb; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Login UI -->
    <div id="ui-layer">
        <div class="glass-panel" id="loginBox">
            <h2>Pilot Login</h2>
            <input type="text" id="username" placeholder="Callsign" style="padding:10px; border-radius:8px; border:none; margin:10px 0;"><br>
            <button onclick="startGame()">ENTER COCKPIT</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let player = { x: 50, y: canvas.height/2, w: 50, h: 30, score: 0 };
        let enemies = [];
        let gameRunning = false;

        function startGame() {
            const name = document.getElementById('username').value;
            if(!name) return alert("Enter your callsign");
            document.getElementById('ui-layer').style.display = 'none';
            gameRunning = true;
            animate();
        }

        // Controls
        window.addEventListener('touchmove', (e) => {
            player.y = e.touches[0].clientY - 15;
        });

        function animate() {
            if(!gameRunning) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Player
            ctx.fillStyle = "#00d2ff";
            ctx.fillRect(player.x, player.y, player.w, player.h);

            // Spawn Enemies
            if(Math.random() < 0.03) enemies.push({ x: canvas.width, y: Math.random() * canvas.height, w: 40, h: 20 });

            // Update Enemies
            enemies.forEach((en, index) => {
                en.x -= 5;
                ctx.fillStyle = "#ff416c";
                ctx.fillRect(en.x, en.y, en.w, en.h);

                // Collision Detection
                if(en.x < player.x + player.w && en.x + en.w > player.x && 
                   en.y < player.y + player.h && en.y + en.h > player.y) {
                    enemies.splice(index, 1);
                    player.score += 100;
                }
            });

            ctx.fillStyle = "white";
            ctx.fillText("SCORE: " + player.score, 20, 20);
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
